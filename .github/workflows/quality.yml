name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow Lint and Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint 1.7.12
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" \
            | sha256sum --check
          tar xzf actionlint.tar.gz
      - name: Run actionlint
        run: ./actionlint .github/workflows/*.yml
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@a91218c45134530ecc7aefc3eec3f997a279ad37
        with:
          version: 1.30.1
          advanced-security: "false"
          annotations: "true"

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Install SQLite (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked -j 2
      - name: Run scoped mutation tests
        run: |
          tests=()
          for path in diesel-builders/tests/test_*.rs; do
            name="${path##*/}"
            tests+=(--test "${name%.rs}")
          done
          cargo mutants -p diesel-builders -j 2 \
            --file diesel-builders/src/insert_transaction.rs \
            -- "${tests[@]}"

  example-coverage:
    name: Public Example Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly
      - name: Install SQLite (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Generate rustdoc JSON
        run: |
          cargo +nightly rustdoc -p diesel-builders --lib -j 2 \
            -- -Z unstable-options --output-format json --document-private-items
          cargo +nightly rustdoc -p diesel-builders-derive --lib -j 2 \
            -- -Z unstable-options --output-format json --document-private-items
      - name: Check public method examples
        run: |
          python3 scripts/check_public_examples.py \
            target/doc/diesel_builders.json \
            target/doc/diesel_builders_derive.json
